name: WLED build

# Compiles WLED for the sign and tree controllers (env esp32dev, release name "ESP32", what both run) and makes a
# release "wled-v<ref>" in this repo with a full USB image and an over-the-air image:
#   wled-esp32-factory.bin / wled-esp32-ota.bin
# Refs ending in -ditherN come from Jeff's fork thejeffe/WLED (temporal dithering); others from wled/WLED unchanged.
# Run it from the Actions tab, or push a tag like wled-v16.0.1-dither1 (builds thejeffe/WLED tag v16.0.1-dither1).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "WLED tag to build, without the v (e.g. 16.0.1-dither1 from thejeffe/WLED, or 16.0.1 stock)"
        default: "16.0.1-dither1"
  push:
    tags: ["wled-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: esp32dev
            out: wled-esp32
    steps:
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/wled-v* ]]; then v="${GITHUB_REF_NAME#wled-v}"; else v="${{ inputs.version }}"; fi
          echo "WLED_VERSION=$v" >> "$GITHUB_ENV"
          if [[ "$v" == *-dither* ]]; then echo "WLED_REPO=thejeffe/WLED" >> "$GITHUB_ENV"; else echo "WLED_REPO=wled/WLED" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WLED_REPO }}
          ref: v${{ env.WLED_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the web UI
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-wled-${{ env.WLED_VERSION }}-${{ matrix.env }}

      - name: Install PlatformIO
        run: pip install -r requirements.txt && pip install esptool==4.8.1

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Package
        run: |
          B=.pio/build/${{ matrix.env }}
          BOOT_APP0=$(find ~/.platformio/packages -path '*tools/partitions/boot_app0.bin' | head -1)
          test -n "$BOOT_APP0"
          mkdir -p out
          esptool.py --chip esp32 merge_bin -o out/${{ matrix.out }}-factory.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin out/${{ matrix.out }}-ota.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/*.bin

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/wled-v* ]]; then v="${GITHUB_REF_NAME#wled-v}"; else v="${{ inputs.version }}"; fi
          echo "WLED_VERSION=$v" >> "$GITHUB_ENV"
          if [[ "$v" == *-dither* ]]; then echo "WLED_REPO=thejeffe/WLED" >> "$GITHUB_ENV"; else echo "WLED_REPO=wled/WLED" >> "$GITHUB_ENV"; fi
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wled-v${{ env.WLED_VERSION }}
          name: WLED ${{ env.WLED_VERSION }}
          body: Built from https://github.com/${{ env.WLED_REPO }}/tree/v${{ env.WLED_VERSION }}
          files: out/*.bin
          make_latest: true
