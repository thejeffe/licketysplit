<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lickety Split</title>
<meta name="description" content="Flash and update the ESP32 devices: Matrixinator, AirPlay receiver, WLED.">
<meta name="theme-color" content="#0D141B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lickety Split">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="vendor/esp-web-tools/install-button.js"></script>
</head>
<body>
<main class="wrap">
 <header class="top">
  <div class="brand">
   <img src="icon.svg" alt="" width="52" height="52">
   <div class="title"><h1>Lickety Split</h1><span>Flash and update the ESP32 devices</span></div>
  </div>
  <div class="topacts"><button type="button" id="refresh">Check for new builds</button><button type="button" id="reloadBtn" aria-label="Reload" title="Reload the page (for the home-screen app)">↻</button><button type="button" id="setBtn" aria-label="Settings" title="Settings">⚙</button></div>
 </header>
 <p class="msg" id="msg" role="status"></p>

 <section class="box">
  <h2>Your devices</h2>
  <p class="note">Update over Wi-Fi: sends the newest build to a device that's already running. Its settings are kept, and it restarts when it's done.</p>
  <div class="list" id="devs"></div>
  <form class="add" id="addForm">
   <label>Name<input id="aName" type="text" placeholder="Living room screen" maxlength="60"></label>
   <label>Host name or IP<input id="aHost" type="text" placeholder="192.168.1.50" autocapitalize="off" spellcheck="false"></label>
   <label>Runs<select id="aFw"></select></label>
   <button type="submit">Add device</button>
  </form>
 </section>

 <section class="box">
  <h2>Flash over USB</h2>
  <p class="note" id="usbNote"></p>
  <div class="list" id="cards"></div>
 </section>
</main>

<dialog id="setDlg" aria-labelledby="setTitle">
 <form method="dialog" id="setForm">
  <h2 id="setTitle">Settings</h2>
  <label>GitHub owner (user or organization the firmware repos belong to)<input id="sOwner" type="text" autocapitalize="off" spellcheck="false" placeholder="your-github-name"></label>
  <p class="note" id="sRepos"></p>
  <p class="note" id="sToken"></p>
  <div class="acts"><span class="msg" id="sMsg" role="status"></span><button type="button" id="sCancel">Cancel</button><button type="submit" class="pri">Save</button></div>
 </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
